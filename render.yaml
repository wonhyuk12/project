# ===================================================================
# render.yaml  —  Render 배포 설계도(Blueprint)  [Phase 4-A]
# -------------------------------------------------------------------
# 이 파일이 있으면 Render 가 "무엇을 어떻게 띄울지"를 자동으로 읽어 갑니다.
#   - 사장님 PC 없이도 클라우드에서 앱이 계속 돌아가게 하는 설정입니다.
#   - Render 대시보드에서 New + → Blueprint → (이 저장소 선택) 하면
#     이 내용대로 웹 서비스가 만들어집니다.
#
# ※ 비밀 키(4개)는 여기에 '값'을 적지 않습니다! (sync: false)
#   → git 에 값이 올라가지 않도록, 값은 Render 대시보드의 Environment 에서만 넣습니다.
# ===================================================================

services:
  - type: web                       # 웹 서비스(항상 켜져 응답하는 서버)
    name: gold-plaza                # 서비스 이름 (원하면 바꿔도 됨)
    runtime: python                 # 파이썬 앱
    plan: free                      # 무료 요금제 (15분 유휴 시 잠들기 있음)
    region: singapore               # 한국에서 가까운 지역 (없으면 대시보드에서 변경)
    branch: main                    # 이 브랜치에 push 하면 자동 재배포

    # 라이브러리 설치 (requirements.txt 그대로)
    buildCommand: pip install -r requirements.txt

    # 앱 실행. Render 가 정해주는 포트($PORT)에 반드시 맞춰야 합니다.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # 파이썬 버전 고정 (개발 환경과 동일). 혹시 빌드 중 특정 라이브러리
      # 설치가 실패하면 3.12.x 로 낮춰 보세요.
      - key: PYTHON_VERSION
        value: "3.13.4"

      # --- 비밀 키 4개: 값은 대시보드에서 직접 입력 (sync:false = 값 비워둠) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
